<!doctype html>
<!-- Portable sign-in page: same-origin development session endpoint, open editorial composition. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sign in to Nomcci CVMaker." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9e8e4" />
    <title>Sign in · Nomcci CVMaker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cvmaker.theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d1117" : "#e9e8e4");
        } catch (error) {}
      })();
    </script>
    <style>
      :root {
        --bg: #e9e8e4; --bg-2: #dedddb; --surface: #fbfaf6; --surface-2: #f1f0ed; --surface-3: #e6e5e2;
        --ink: #131922; --ink-2: #4a5563; --ink-3: #737d8a; --line: #d4d7dc; --line-strong: #131922;
        --brand: #0f6f78; --solid: #131922; --solid-ink: #fbfaf6; --accent: #2f7fd6;
        --accent-ink: #ffffff; --danger: #a32a2a; --danger-soft: rgba(163, 42, 42, .1);
        --shadow: 0 30px 80px -34px rgba(9, 13, 19, .52);
        --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;
        --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Hoefler Text", Georgia, serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --ease: cubic-bezier(.22, .61, .36, 1); --dur-2: 200ms; --dur-3: 340ms;
      }
      [data-theme="dark"] {
        --bg: #0d1117; --bg-2: #080b10; --surface: #161b22; --surface-2: #1c232c; --surface-3: #232b36;
        --ink: #e8edf2; --ink-2: #b0b9c4; --ink-3: #828c99; --line: #29313b; --line-strong: #3b4552;
        --brand: #5cc9c0; --solid: #1d4b73; --solid-ink: #eaf4ff; --accent: #63b8f0;
        --accent-ink: #06121f; --danger: #e58383; --danger-soft: rgba(229, 131, 131, .12);
        --shadow: 0 30px 80px -34px rgba(0, 0, 0, .88);
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); font-family: var(--font-sans);
        line-height: 1.55; -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
          var(--bg);
        transition: background-color var(--dur-3) var(--ease), color var(--dur-3) var(--ease);
      }
      h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em; line-height: 1.08; margin: 0; }
      p { margin: 0; }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

      .shell {
        position: relative;
        width: min(1120px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: calc(clamp(1.25rem, 4vw, 2.75rem) + env(safe-area-inset-top)) clamp(1.15rem, 4vw, 3rem) clamp(1.25rem, 4vw, 2.75rem);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(1.75rem, 5vw, 3.5rem);
      }

      .masthead { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
      .brand { display: inline-flex; align-items: center; gap: .65rem; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-size: 1.12rem; letter-spacing: -.01em; }
      .brand b { font-weight: 700; }
      .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px -10px color-mix(in srgb, var(--accent) 80%, transparent); }
      .lang { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface-2); }
      .lang button { min-width: 46px; min-height: 34px; border: 0; background: transparent; color: var(--ink-2); font-size: .78rem; font-weight: 600; padding: .35rem .6rem; border-radius: var(--r-pill); cursor: pointer; transition: background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease); }
      .lang button[aria-pressed="true"] { background: var(--solid); color: var(--solid-ink); }
      .lang button:not([aria-pressed="true"]):hover { color: var(--ink); }

      .composition { display: grid; grid-template-columns: minmax(0, 1.08fr) auto minmax(0, .92fr); align-items: center; gap: clamp(1.75rem, 5vw, 3.5rem); }
      .rule { align-self: stretch; width: 1px; background: linear-gradient(180deg, transparent, var(--line) 12%, var(--line) 88%, transparent); }

      .story { position: relative; isolation: isolate; max-width: 44ch; animation: rise .5s var(--ease) both; }
      .story h1 { font-size: clamp(2rem, 4.8vw, 3.3rem); text-wrap: balance; }
      .story p { margin-top: 1.1rem; max-width: 52ch; color: var(--ink-2); font-size: 1.02rem; text-wrap: pretty; }
      .story-foot { margin-top: 1.5rem; color: var(--ink-3); font-size: .78rem; }
      .socials { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.5rem; }
      .socials a {
        display: inline-flex; align-items: center; gap: .5rem;
        min-height: 44px; padding: .55rem 1.05rem;
        border: 1px solid var(--line); border-radius: var(--r-pill);
        background: transparent; color: var(--ink-2);
        font-size: .82rem; font-weight: 600; text-decoration: none;
        transition: transform 150ms var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
      }
      .socials a:hover { border-color: var(--line-strong); color: var(--ink); background: var(--surface); transform: translateY(-1px); }
      .socials svg { flex: 0 0 auto; }

      /* Abstract CV proof sheet: depth only, never read by assistive tech. */
      .proof-sheet {
        position: absolute;
        right: -6%;
        bottom: -14%;
        z-index: -1;
        width: clamp(180px, 24vw, 260px);
        aspect-ratio: 210 / 297;
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: .55rem;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--surface);
        box-shadow: var(--shadow);
        opacity: .5;
        transform: rotate(-7deg);
        pointer-events: none;
      }
      .proof-sheet i { display: block; height: 6px; border-radius: 3px; background: var(--surface-3); }
      .proof-sheet i:first-child { width: 58%; height: 12px; background: color-mix(in srgb, var(--ink) 72%, transparent); }
      .proof-sheet i:nth-child(2) { width: 76%; background: color-mix(in srgb, var(--accent) 55%, var(--surface-3)); }
      .proof-sheet i:nth-child(4) { width: 62%; }
      .proof-sheet i:nth-child(5) { width: 84%; }
      .proof-sheet i:last-child { width: 44%; margin-top: auto; }

      .access { max-width: 30rem; animation: rise .5s var(--ease) both .06s; }
      .access h2 { font-size: clamp(1.45rem, 3vw, 1.8rem); }
      .access-help { margin-top: .55rem; color: var(--ink-2); font-size: .92rem; line-height: 1.6; text-wrap: pretty; }
      .access form { margin-top: 1.6rem; display: flex; flex-direction: column; gap: var(--space-3); }
      .cta {
        width: 100%;
        min-height: 54px;
        padding: .9rem 1.4rem;
        border: 1px solid var(--solid);
        border-radius: var(--r-pill);
        background: var(--solid);
        color: var(--solid-ink);
        font-weight: 600;
        font-size: .98rem;
        cursor: pointer;
        transition: transform 150ms var(--ease), box-shadow var(--dur-2) var(--ease), opacity var(--dur-2) var(--ease);
      }
      .cta:hover:not(:disabled) { box-shadow: 4px 4px 0 0 var(--accent); transform: translateY(-1px); }
      .cta:active:not(:disabled) { transform: translateY(1px) scale(.99); }
      .cta:disabled { opacity: .55; cursor: wait; }
      #loginMessage { min-height: 1.4em; color: var(--ink-3); font-size: .84rem; }
      #loginMessage.error { color: var(--danger); }

      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

      @media (max-width: 860px) {
        .composition { grid-template-columns: 1fr; align-items: start; gap: 1.75rem; }
        .rule { width: 100%; height: 1px; align-self: auto; background: var(--line); }
        .story h1 { font-size: clamp(1.8rem, 7vw, 2.5rem); }
        .proof-sheet { display: none; }
        .access { max-width: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="brand" href="/" aria-label="Nomcci CVMaker">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="250 180 760 850" width="20" height="20" fill="currentColor" aria-hidden="true"><polygon points="293,228 293,368 961,983 962,781 837,663 831,712" /><polygon points="293,419 293,987 421,872 421,534" /><polygon points="961,242 837,364 837,619 961,739" /><polygon points="455,565 461,652 819,985 907,986" /></svg>
          </span>
          <span>Nomcci <b>CVMaker</b></span>
        </a>
        <div class="lang" role="group" aria-label="Language" id="langGroup">
          <button type="button" id="langEn" aria-pressed="true">EN</button>
          <button type="button" id="langEs" aria-pressed="false">ES</button>
        </div>
      </header>

      <div class="composition">
        <section class="story">
          <span class="proof-sheet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <h1 data-i18n="loginHero">Build the exact CV each role deserves.</h1>
          <p data-i18n="loginSubtitle">One workspace for job notes, targeted rewrites, a live preview, and clean PDF exports.</p>
          <div class="socials" aria-label="Nomcci social links">
            <a href="https://github.com/NomcciDubs" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
              <span>GitHub</span>
            </a>
            <a href="https://www.linkedin.com/in/andres-felipe-garcia-n/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
              <span>LinkedIn</span>
            </a>
          </div>
          <p class="story-foot">Nomcci CVMaker</p>
        </section>

        <div class="rule" aria-hidden="true"></div>

        <section class="access" aria-labelledby="access-title">
          <h2 id="access-title" data-i18n="loginTitle">Sign in</h2>
          <p class="access-help" data-i18n="loginHelp">Continue with the development session available on this workspace.</p>
          <form id="loginForm">
            <button type="submit" class="cta" id="sendButton" data-i18n="sendLink">Continue</button>
            <p id="loginMessage" role="status"></p>
          </form>
        </section>
      </div>

      <footer class="story-foot">Nomcci CVMaker</footer>
    </main>
    <script type="module">
      const translations = {
        en: { loginHero: "Build the exact CV each role deserves.", loginSubtitle: "One workspace for job notes, targeted rewrites, a live preview, and clean PDF exports.", loginTitle: "Sign in", loginHelp: "Continue with the development session available on this workspace.", sendLink: "Continue", sending: "Signing in…", checkEmail: "Signed in. Redirecting…", unavailable: "Sign-in is unavailable. Configure an authentication provider for this workspace." },
        es: { loginHero: "Construye el CV exacto que cada rol merece.", loginSubtitle: "Un espacio para notas de vacantes, reescrituras enfocadas, vista previa y PDFs limpios.", loginTitle: "Iniciar sesión", loginHelp: "Continúa con la sesión de desarrollo disponible en este espacio.", sendLink: "Continuar", sending: "Iniciando sesión…", checkEmail: "Sesión iniciada. Redirigiendo…", unavailable: "El inicio de sesión no está disponible. Configura un proveedor de autenticación para este espacio." },
      };
      const meta = {
        en: { title: "Sign in · Nomcci CVMaker", description: "Sign in to Nomcci CVMaker." },
        es: { title: "Iniciar sesión · Nomcci CVMaker", description: "Inicia sesión en Nomcci CVMaker." },
      };
      const isLang = (value) => value === "en" || value === "es";

      // Small offline fallback mirroring src/i18n/locale.ts: route, shared preference, browser, English.
      function readCookie(name) {
        const entry = document.cookie.split("; ").find((part) => part.startsWith(`${name}=`));
        return entry ? decodeURIComponent(entry.slice(name.length + 1)) : null;
      }
      function detectInitialLang() {
        const route = window.location.pathname.split("/").filter(Boolean)[0]?.toLowerCase();
        if (isLang(route)) return route;
        const shared = readCookie("nomcci_lang");
        if (isLang(shared)) return shared;
        let stored = null;
        try { stored = window.localStorage.getItem("cvmaker.locale"); } catch {}
        if (isLang(stored)) return stored;
        const browser = navigator.language || navigator.languages?.[0] || "en";
        return browser.toLowerCase().startsWith("es") ? "es" : "en";
      }
      function persistLang(lang) {
        try { window.localStorage.setItem("cvmaker.locale", lang); } catch {}
        let cookie = `nomcci_lang=${lang}; path=/; max-age=31536000; samesite=lax`;
        if (/(^|\.)nomcci\.com$/i.test(window.location.hostname)) cookie += "; domain=.nomcci.com";
        try { document.cookie = cookie; } catch {}
      }

      const state = { lang: detectInitialLang() };
      const form = document.getElementById("loginForm");
      const message = document.getElementById("loginMessage");
      const sendButton = document.getElementById("sendButton");

      function t(key) { return translations[state.lang][key] || translations.en[key] || key; }
      function applyLanguage() {
        document.documentElement.lang = state.lang;
        document.title = meta[state.lang].title;
        document.querySelector('meta[name="description"]')?.setAttribute("content", meta[state.lang].description);
        document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
        document.getElementById("langEn").setAttribute("aria-pressed", String(state.lang === "en"));
        document.getElementById("langEs").setAttribute("aria-pressed", String(state.lang === "es"));
      }
      function setStatus(text, isError) {
        message.textContent = text;
        message.classList.toggle("error", Boolean(isError));
        message.setAttribute("role", isError ? "alert" : "status");
      }
      function selectLang(lang) {
        if (!isLang(lang) || lang === state.lang) return;
        state.lang = lang;
        persistLang(lang);
        applyLanguage();
      }
      document.getElementById("langEn").addEventListener("click", () => selectLang("en"));
      document.getElementById("langEs").addEventListener("click", () => selectLang("es"));

      try {
        const session = await fetch("/api/me", { credentials: "include", cache: "no-store" });
        if (session.ok) window.location.replace("/");
      } catch { /* offline: stay on the login page */ }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        sendButton.disabled = true;
        setStatus(t("sending"), false);
        try {
          const response = await fetch("/api/dev/login", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: "{}",
          });
          if (response.ok) {
            setStatus(t("checkEmail"), false);
            window.location.replace("/");
            return;
          }
          setStatus(t("unavailable"), true);
        } catch {
          setStatus(t("unavailable"), true);
        } finally {
          sendButton.disabled = false;
        }
      });

      applyLanguage();
    </script>
  </body>
</html>
