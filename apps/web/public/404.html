<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9e8e4" />
    <title>Page not found · Nomcci CVMaker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cvmaker.theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d1117" : "#e9e8e4");
        } catch (error) {}
      })();
    </script>
    <style>
      :root {
        --bg: #e9e8e4; --surface: #fbfaf6; --surface-2: #f1f0ed; --ink: #131922;
        --ink-2: #4a5563; --ink-3: #737d8a; --line: #d4d7dc; --accent: #2f7fd6;
        --accent-ink: #ffffff; --solid: #131922; --solid-ink: #fbfaf6; --ghost: rgba(19, 25, 34, .06);
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --ease: cubic-bezier(.22, .61, .36, 1);
      }
      [data-theme="dark"] {
        --bg: #0d1117; --surface: #161b22; --surface-2: #1c232c; --ink: #e8edf2;
        --ink-2: #b0b9c4; --ink-3: #828c99; --line: #29313b; --accent: #63b8f0;
        --accent-ink: #06121f; --solid: #1d4b73; --solid-ink: #eaf4ff; --ghost: rgba(232, 237, 242, .06);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        color: var(--ink); font-family: var(--font-sans);
        background: radial-gradient(110% 80% at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), var(--bg);
      }
      .card { position: relative; width: min(560px, 100%); overflow: hidden; padding: clamp(1.75rem, 5vw, 3rem); border: 1px solid var(--line); border-radius: 28px; background: var(--surface); box-shadow: 0 34px 90px -40px rgba(9, 13, 19, .58); text-align: left; animation: rise .45s var(--ease) both; }
      .code { position: absolute; right: -1rem; top: -3.5rem; font-family: var(--font-display); font-size: 12rem; line-height: 1; color: var(--ghost); pointer-events: none; user-select: none; }
      .brand { position: relative; display: inline-flex; align-items: center; gap: .65rem; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-size: 1.05rem; }
      .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
      .brand b { font-weight: 700; }
      h1 { position: relative; margin: 1.5rem 0 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance; }
      p { position: relative; margin: .8rem 0 0; max-width: 46ch; color: var(--ink-2); line-height: 1.6; }
      .actions { position: relative; display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.75rem; }
      a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: .7rem 1.25rem; border: 1px solid var(--solid); border-radius: 999px; background: var(--solid); color: var(--solid-ink); text-decoration: none; font-weight: 600; font-size: .9rem; transition: transform .15s var(--ease), box-shadow .2s var(--ease); }
      a.btn:hover { transform: translateY(-1px); box-shadow: 4px 4px 0 0 var(--accent); }
      a.btn.secondary { background: transparent; color: var(--ink); }
      a.btn.secondary:hover { background: var(--surface-2); box-shadow: none; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="code" aria-hidden="true">404</span>
      <a class="brand" href="/" aria-label="Nomcci CVMaker">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="250 180 760 850" width="19" height="19" fill="currentColor" aria-hidden="true"><polygon points="293,228 293,368 961,983 962,781 837,663 831,712" /><polygon points="293,419 293,987 421,872 421,534" /><polygon points="961,242 837,364 837,619 961,739" /><polygon points="455,565 461,652 819,985 907,986" /></svg>
        </span>
        <span>Nomcci <b>CVMaker</b></span>
      </a>
      <h1 data-i18n="title">This page went missing.</h1>
      <p data-i18n="body">The address may be mistyped or the page has moved. Your CVs and drafts are safe.</p>
      <div class="actions">
        <a class="btn" href="/" data-i18n="home">Back to CVMaker</a>
        <a class="btn secondary" href="/login" data-i18n="signIn">Sign in</a>
      </div>
    </main>
    <script>
      var isEs = (localStorage.getItem("cvmaker.login.lang") || navigator.language || "en").toLowerCase().indexOf("es") === 0;
      var dict = {
        en: { title: "This page went missing.", body: "The address may be mistyped or the page has moved. Your CVs and drafts are safe.", home: "Back to CVMaker", signIn: "Sign in" },
        es: { title: "Esta página se perdió.", body: "Puede que la dirección esté mal escrita o que la página se haya movido. Tus CVs y borradores están a salvo.", home: "Volver a CVMaker", signIn: "Iniciar sesión" },
      };
      var lang = isEs ? "es" : "en";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        node.textContent = dict[lang][node.dataset.i18n] || node.textContent;
      });
    </script>
  </body>
</html>
